name: Re-check the shipped presets

# Streams move and stations close, and a preset full of dead links is worse
# than no preset at all: the receiver's only feedback is a spinner. This walks
# every file in presets/ once a week, connects to every stream, and opens a
# pull request if anything changed.
#
# It never commits to master. What belongs in a national preset is a human
# decision (see presets/README.md), and a stream can stop answering for reasons
# that have nothing to do with the station being gone -- which is also why a
# removal takes three consecutive weekly failures rather than one. The strike
# count lives in presets/strikes.json and is carried in the same pull request.
#
# GitHub disables a scheduled workflow after 60 days without a push to the
# default branch, and says so by email. If this stops running, that is the
# first thing to check.

on:
  schedule:
    - cron: '17 4 * * 1'          # Mondays, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preset-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Re-check every preset
    runs-on: ubuntu-latest
    # Every station in every preset is connected to, one at a time, with an
    # eight-second bound each. A hundred stations is a quarter of an hour.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Connect to every stream
        run: |
          set -eu
          ./script/refresh-presets.sh 2>&1 | tee "${RUNNER_TEMP}/refresh.log"

      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if git diff --quiet -- presets/; then
            echo "Nothing changed; every station still plays."
            exit 0
          fi

          # A dated branch rather than one reused branch: a pull request nobody
          # has looked at yet must not be overwritten by the next week's run,
          # and force-pushing over it is how that happens.
          BRANCH="preset-refresh/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add presets/
          git commit -m "Weekly preset re-check: $(date -u +%Y-%m-%d)"
          git push -u origin "$BRANCH"

          {
            echo "Every stream in \`presets/\` was connected to. What follows is"
            echo "what the run found; nothing here is a decision."
            echo
            echo "A station is only removed after **three consecutive weekly"
            echo "failures** -- \`warn\` lines are a watchlist, \`drop\` lines are"
            echo "removals. A station that plays again on any later run has its"
            echo "count cleared, so three failures spread over a year never add"
            echo "up to a removal."
            echo
            echo "Check a dropped station by hand before merging: a stream can"
            echo "stop answering a datacentre in particular, and a broadcaster"
            echo "that has moved its URL wants the new one rather than deleting."
            echo
            echo '```'
            cat "${RUNNER_TEMP}/refresh.log"
            echo '```'
            echo
            echo '---'
            echo '_Generated by [Claude Code](https://claude.ai/code)_'
          } > "${RUNNER_TEMP}/body.md"

          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "Weekly preset re-check: $(date -u +%Y-%m-%d)" \
            --body-file "${RUNNER_TEMP}/body.md"

name: Binaries

# Nobody should have to install a Pascal compiler to run a radio server. This
# builds the binary on each platform's own runner and attaches the results to
# the run; a tag starting with v also publishes them as a release.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A push supersedes the run before it. Without this a hung job holds a runner
# until the six-hour ceiling, which is how one stalled download outlived several
# later pushes.
concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Every one of these finishes inside three minutes when it is working.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
          - os: macos-latest
            target: aarch64-darwin
          # macos-13 was never scheduled - the label has been retired, and a job
          # asking for it queues for ever rather than failing. macos-15-intel is
          # its replacement.
          - os: macos-15-intel
            target: x86_64-darwin
          # Named for the platform: which architecture comes out depends on
          # whether the installed compiler carries the x86_64 cross-compiler,
          # and the artifact is named from what it actually targeted.
          - os: windows-latest
            target: windows
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install the compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fp-compiler fp-units-fcl fp-units-net fp-units-db fp-units-misc \
            lazarus-src zip

      - name: Install the compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install fpc

      # Debian packages the LazUtils sources; nobody else does. A sparse
      # checkout takes the two directories the build needs without the rest of
      # Lazarus, which is a large repository to clone for four units.
      # Chocolatey's freepascal package is the i386 compiler and carries no
      # x86_64 cross-compiler, so it can only produce a 32-bit binary. The
      # project's own win64 installer is a native x86_64 compiler and writes its
      # own configuration, which the package also did not do.
      - name: Install the compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Chocolatey first: it always works and guarantees a compiler, even if
          # only the 32-bit one. Then try to put a native x86_64 compiler beside
          # it. The mirror list is a list because download.freepascal.org, which
          # looks like the obvious host, does not exist.
          choco install freepascal --no-progress -y
          $exe = "$env:RUNNER_TEMP\fpc-win64.exe"
          $urls = @(
            'https://ftp.freepascal.org/pub/fpc/dist/3.2.2/x86_64-win64/fpc-3.2.2.x86_64-win64.exe',
            'https://downloads.sourceforge.net/project/freepascal/Win32/3.2.2/fpc-3.2.2.x86_64-win64.exe',
            'https://master.dl.sourceforge.net/project/freepascal/Win32/3.2.2/fpc-3.2.2.x86_64-win64.exe?viasf=1'
          )
          # curl.exe rather than Invoke-WebRequest: --max-time is a deadline on
          # the whole transfer, and a mirror that accepts the connection and
          # then says nothing is exactly what hung this job for thirteen minutes
          # when nothing bounded it.
          foreach ($u in $urls) {
            Write-Host "trying $u"
            curl.exe -fL --connect-timeout 15 --max-time 240 --retry 1 -o $exe $u
            if ($LASTEXITCODE -eq 0 -and (Test-Path $exe)) {
              Write-Host "downloaded from $u"
              break
            }
            Write-Host "  no: curl exit $LASTEXITCODE"
            Remove-Item $exe -ErrorAction SilentlyContinue
          }
          if (Test-Path $exe) {
            $p = Start-Process -Wait -PassThru -FilePath $exe `
                   -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\fpc'
            Write-Host "installer exit code: $($p.ExitCode)"
          } else {
            Write-Host "::warning::no win64 installer could be fetched; the 32-bit compiler stands"
          }

      - name: Find the compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $roots = 'C:\fpc', 'C:\FPC', 'C:\tools', 'C:\ProgramData\chocolatey\lib',
                   'C:\Program Files', 'C:\Program Files (x86)'
          $fpc = $null
          foreach ($r in $roots) {
            if (-not (Test-Path $r)) { continue }
            $fpc = Get-ChildItem -Path $r -Filter fpc.exe -Recurse -Depth 6 `
                     -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($fpc) { break }
          }
          if (-not $fpc) { throw "fpc.exe not found after install" }
          Write-Host "found: $($fpc.FullName)"
          Add-Content -Path $env:GITHUB_PATH -Value $fpc.DirectoryName
          # bin\<target>\fpc.exe, so the installation root is two levels up.
          $root = Split-Path (Split-Path $fpc.DirectoryName -Parent) -Parent
          Add-Content -Path $env:GITHUB_ENV -Value "FPC_BIN=$($fpc.DirectoryName)"
          Add-Content -Path $env:GITHUB_ENV -Value "FPC_ROOT=$root"

      # The package installs a compiler and no configuration, so fpc cannot find
      # its own RTL: the first thing it compiles fails with "Can't find unit
      # StrUtils", which reads like a missing dependency and is really a missing
      # -Fu line. fpcmkcfg writes the file the installer would have.
      - name: Configure the compiler (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "root: $FPC_ROOT"
          ls "$FPC_ROOT" || true
          if [ ! -f "$FPC_BIN/fpc.cfg" ]; then
            fpcmkcfg -d "basepath=$FPC_ROOT" -o "$FPC_BIN/fpc.cfg"
            echo "--- generated fpc.cfg (unit paths):"
            grep -i '^-Fu' "$FPC_BIN/fpc.cfg" || true
          else
            echo "fpc.cfg already present"
          fi

      - name: LazUtils sources (macOS and Windows)
        if: runner.os != 'Linux'
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://gitlab.com/freepascal.org/lazarus/lazarus.git "$RUNNER_TEMP/lazarus"
          git -C "$RUNNER_TEMP/lazarus" sparse-checkout set components/lazutils
          echo "LAZUTILS_DIR=$RUNNER_TEMP/lazarus/components/lazutils" >> "$GITHUB_ENV"

      # A native x86_64 compiler needs no -P flag; this is here to fail loudly
      # rather than quietly shipping a 32-bit binary if the install ever changes
      # back to one.
      - name: Confirm the Windows target
        if: runner.os == 'Windows'
        run: |
          ls "$FPC_BIN"
          echo "compiler targets: $(fpc -iTP)-$(fpc -iTO)"
          if [ "$(fpc -iTP)" != x86_64 ]; then
            if [ -f "$FPC_BIN/ppcrossx64.exe" ]; then
              echo "FPC_FLAGS=-Px86_64 -Twin64" >> "$GITHUB_ENV"
              echo ">>> using the x86_64 cross-compiler"
            else
              echo "::warning::this compiler makes $(fpc -iTP) and has no x86_64 cross-compiler, so the artifact is 32-bit"
            fi
          fi

      - name: Cache Indy checkout
        uses: actions/cache@v4
        with:
          path: .build/indy
          key: indy-${{ runner.os }}-${{ runner.arch }}-1

      # What the compiler actually targets is its business, not the matrix's.
      # Chocolatey's Windows package is the 32-bit compiler, so this job builds
      # i386-win32 and says so rather than mislabelling it x86_64.
      - name: Report the toolchain
        id: toolchain
        run: |
          fpc -iV
          echo "target=$(fpc -iTP)-$(fpc -iTO)" >> "$GITHUB_OUTPUT"
          echo "target: $(fpc -iTP)-$(fpc -iTO)"

      - name: Build
        run: ./script/build.sh

      # The point of building on the platform's own runner is that the result
      # is then known to work there, not merely to have compiled. This is the
      # same suite the Linux job has always run.
      # The suites start the binary and speak HTTP to it. That has never been
      # tried under Git Bash, so the Windows job proves the build and leaves
      # running it to the platforms where the suite is known to work.
      - name: Smoke test
        if: runner.os != 'Windows'
        run: ./script/smoke-test.sh

      # FPC's own backtrace on Darwin prints addresses and no lines, so this asks
      # two questions a single address cannot answer. First: does it start at
      # all with the checks on and cmem left out - that build swaps the memory
      # manager back, so a difference points straight at cmem. Second: what does
      # a debugger say, since lldb has the symbols FPC's line-info unit cannot
      # find here.
      - name: Diagnose the crash
        if: failure() && runner.os == 'macOS'
        run: |
          work=$(mktemp -d)
          cat > "$work/retuner.ini" <<'INI'
          [Configuration]
          INIVersion=1.2.2
          MessageInfoLevel=4
          IPAddress=127.0.0.1
          [WebServer]
          WebServerIPAddress=127.0.0.1
          WebServerPort=18999
          [DNSServer]
          Enable=0
          [RadioBrowser]
          Enable=0
          [MyStations]
          Enable=0
          INI
          sed -i.bak 's/^          //' "$work/retuner.ini"

          echo "=============== checked build, no cmem ==============="
          CHECKED=1 ./script/build.sh >/dev/null
          cp bin/*/retuner "$work/"
          ( cd "$work" && ./retuner & echo $! > "$work/pid" ) || true
          sleep 6
          if kill -0 "$(cat "$work/pid")" 2>/dev/null; then
            echo ">>> the checked build STARTED and is still running"
            kill "$(cat "$work/pid")" 2>/dev/null || true
          else
            echo ">>> the checked build also died"
          fi

          echo "=============== debug build under lldb ==============="
          DEBUG=1 ./script/build.sh >/dev/null
          cp bin/*/retuner "$work/"
          ( cd "$work" && lldb -b -o run -o "bt all" -o quit -- ./retuner ) &
          lldb_pid=$!
          ( sleep 90; kill "$lldb_pid" 2>/dev/null ) &
          wait "$lldb_pid" || true

      - name: Package
        id: package
        run: |
          version=$(sed -n "s/^ *APP_VERSION *= *'\(.*\)';.*/\1/p" src/common.pas)
          target=${{ steps.toolchain.outputs.target }}
          stage="retuner-$version-$target"
          mkdir -p "$stage/config"
          if [ "${RUNNER_OS}" = Windows ]; then
            cp "bin/$target/retuner.exe" "$stage/"
          else
            cp "bin/$target/retuner" "$stage/"
          fi
          cp cfg/retuner.ini "$stage/"
          cp cfg/avr.ini cfg/stations.ini cfg/podcasts.ini "$stage/config/"
          cp LICENSE.txt README.md "$stage/"
          tar -czf "$stage.tar.gz" "$stage"
          echo "name=$stage" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -l "$stage.tar.gz"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz \
            --title "Retuner ${GITHUB_REF_NAME}" \
            --generate-notes
